<script>
"use strict";

/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG = {
  GOOGLE_SCRIPT_URL:
    "https://script.google.com/macros/s/AKfycbxeatGVs5HUcaY8FTxAfTsqQ8KqoiF1nQDmDs3Lc_BBEedlYdXxZ2wg5VpSiOiONPem/exec",

  PDF_WORKER_URL:
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"
};


/* =========================================================
   PDF.JS
   ========================================================= */

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    CONFIG.PDF_WORKER_URL;
}


/* =========================================================
   STATE
   ========================================================= */

let selectedFile = null;
let previewUrl = null;
let extractedText = "";
let extractedPages = [];


/* =========================================================
   ELEMENTS
   ========================================================= */

const fileInput =
  document.getElementById("fileInput");

const dropzone =
  document.getElementById("dropzone");

const fileInfo =
  document.getElementById("fileInfo");

const fileName =
  document.getElementById("fileName");

const fileSize =
  document.getElementById("fileSize");

const removeBtn =
  document.getElementById("removeBtn");

const titleField =
  document.getElementById("titleField");

const paperTitle =
  document.getElementById("paperTitle");

const previewSection =
  document.getElementById("previewSection");

const pdfPreview =
  document.getElementById("pdfPreview");

const extractionBox =
  document.getElementById("extractionBox");

const extractionStat =
  document.getElementById("extractionStat");

const fullTextPreview =
  document.getElementById("fullTextPreview");

const uploadBtn =
  document.getElementById("uploadBtn");

const resetBtn =
  document.getElementById("resetBtn");

const progressWrapper =
  document.getElementById("progressWrapper");

const progressFill =
  document.getElementById("progressFill");

const progressText =
  document.getElementById("progressText");

const progressPercent =
  document.getElementById("progressPercent");

const message =
  document.getElementById("message");


/* =========================================================
   EVENTS
   ========================================================= */

fileInput.addEventListener("change", (e) => {

  if (e.target.files[0]) {
    handleSelectedFile(e.target.files[0]);
  }

});


dropzone.addEventListener("dragover", (e) => {

  e.preventDefault();

  dropzone.classList.add("dragover");

});


dropzone.addEventListener("dragleave", () => {

  dropzone.classList.remove("dragover");

});


dropzone.addEventListener("drop", (e) => {

  e.preventDefault();

  dropzone.classList.remove("dragover");

  if (e.dataTransfer.files[0]) {

    handleSelectedFile(
      e.dataTransfer.files[0]
    );

  }

});


dropzone.addEventListener("click", (e) => {

  if (e.target.closest("label")) {
    return;
  }

  fileInput.click();

});


removeBtn.addEventListener(
  "click",
  resetAll
);


resetBtn.addEventListener(
  "click",
  resetAll
);


uploadBtn.addEventListener(
  "click",
  runPipeline
);


/* =========================================================
   SELECT PDF
   ========================================================= */

async function handleSelectedFile(file) {

  clearMessage();

  if (
    file.type !== "application/pdf" &&
    !file.name.toLowerCase().endsWith(".pdf")
  ) {

    showMessage(
      "error",
      "File harus berformat PDF."
    );

    return;
  }


  selectedFile = file;

  fileName.textContent =
    file.name;

  fileSize.textContent =
    (file.size / (1024 * 1024)).toFixed(2)
    + " MB";


  fileInfo.classList.add("show");

  titleField.style.display =
    "block";


  paperTitle.value =
    file.name.replace(
      /\.pdf$/i,
      ""
    );


  uploadBtn.disabled = true;

  extractedText = "";

  extractedPages = [];

  extractionBox.classList.remove(
    "show"
  );


  if (previewUrl) {

    URL.revokeObjectURL(
      previewUrl
    );

  }


  previewUrl =
    URL.createObjectURL(file);

  pdfPreview.src =
    previewUrl;

  previewSection.classList.add(
    "show"
  );


  try {

    setProgress(
      15,
      "Mengekstrak teks PDF..."
    );


    const buffer =
      await file.arrayBuffer();


    const pdf =
      await pdfjsLib
        .getDocument({
          data: buffer
        })
        .promise;


    const totalPages =
      pdf.numPages;


    let pageTexts = [];


    for (
      let i = 1;
      i <= totalPages;
      i++
    ) {

      const page =
        await pdf.getPage(i);


      const content =
        await page.getTextContent();


      const txt =
        content.items
          .map(
            item =>
              item.str || ""
          )
          .join(" ")
          .replace(/\s+/g, " ")
          .trim();


      extractedPages.push({
        page: i,
        text: txt
      });


      pageTexts.push(
        `[PAGE ${i}]\n${txt}`
      );


      const percent =
        15 +
        Math.round(
          (i / totalPages) * 35
        );


      setProgress(
        percent,
        `Mengekstrak halaman ${i} / ${totalPages}...`
      );

    }


    extractedText =
      pageTexts
        .join("\n\n")
        .trim();


    if (!extractedText) {

      throw new Error(
        "PDF kosong atau berupa scan gambar."
      );

    }


    extractionStat.textContent =
      `${totalPages} halaman · ${extractedText.length} karakter`;


    fullTextPreview.textContent =
      extractedText;


    extractionBox.classList.add(
      "show"
    );


    uploadBtn.disabled = false;


    setProgress(
      50,
      "Full text siap disimpan."
    );


  } catch (error) {

    console.error(
      "PDF Extraction error:",
      error
    );


    showMessage(
      "error",
      "Gagal membaca PDF: " +
      error.message
    );

  }

}


/* =========================================================
   MAIN PIPELINE
   ========================================================= */

async function runPipeline() {

  if (
    !selectedFile ||
    !extractedText
  ) {

    return;

  }


  uploadBtn.disabled = true;

  resetBtn.disabled = true;

  clearMessage();


  try {

    const title =
      paperTitle.value.trim() ||
      selectedFile.name.replace(
        /\.pdf$/i,
        ""
      );


    const paperId =
      "PAPER-" +
      Date.now();


    /* -----------------------------------------------------
       STEP 1
       Convert PDF -> Base64
       ----------------------------------------------------- */

    setProgress(
      55,
      "Menyiapkan PDF..."
    );


    const base64Data =
      await fileToBase64(
        selectedFile
      );


    /* -----------------------------------------------------
       STEP 2
       Send everything to Google Apps Script
       ----------------------------------------------------- */

    setProgress(
      65,
      "Mengirim paper ke server..."
    );


    const payload = {

      action: "savePaper",

      paperId: paperId,

      title: title,

      fileName:
        selectedFile.name,

      mimeType:
        "application/pdf",

      base64:
        base64Data,

      pageCount:
        extractedPages.length,

      fullText:
        extractedText

    };


    const result =
      await postGoogleScript(
        payload
      );


    if (
      !result ||
      result.success !== true
    ) {

      throw new Error(
        result?.message ||
        "Server gagal menyimpan paper."
      );

    }


    /* -----------------------------------------------------
       SUCCESS
       ----------------------------------------------------- */

    setProgress(
      100,
      "Selesai!"
    );


    showMessage(
      "success",

      "Berhasil diproses!\n\n" +

      "✓ PDF asli tersimpan di Google Drive\n" +

      "✓ Data paper berhasil ditambahkan ke data.csv\n" +

      "✓ CSV tidak di-download ke komputer\n\n" +

      (
        result.fileUrl
          ? "Google Drive:\n" +
            result.fileUrl
          : ""
      )

    );


  } catch (err) {

    console.error(
      "Pipeline Error:",
      err
    );


    setProgress(
      0,
      "Gagal memproses."
    );


    showMessage(
      "error",

      "Terjadi kesalahan:\n" +
      err.message

    );


    uploadBtn.disabled = false;

  } finally {

    resetBtn.disabled = false;

  }

}


/* =========================================================
   GOOGLE APPS SCRIPT
   ========================================================= */

async function postGoogleScript(payload) {

  const response =
    await fetch(
      CONFIG.GOOGLE_SCRIPT_URL,
      {

        method: "POST",

        mode: "cors",

        redirect: "follow",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)

      }
    );


  const responseText =
    await response.text();


  try {

    return JSON.parse(
      responseText
    );

  } catch (e) {

    console.error(
      "Raw server response:",
      responseText
    );


    throw new Error(
      "Respon Google Apps Script bukan JSON yang valid."
    );

  }

}


/* =========================================================
   FILE -> BASE64
   ========================================================= */

function fileToBase64(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        const result =
          reader.result;


        resolve(
          result.substring(
            result.indexOf(",") + 1
          )
        );

      };


      reader.onerror = () => {

        reject(
          new Error(
            "Gagal membaca file PDF."
          )
        );

      };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   RESET
   ========================================================= */

function resetAll() {

  selectedFile = null;

  extractedText = "";

  extractedPages = [];


  if (previewUrl) {

    URL.revokeObjectURL(
      previewUrl
    );

    previewUrl = null;

  }


  fileInput.value = "";

  fileName.textContent = "-";

  fileSize.textContent = "-";

  paperTitle.value = "";


  fileInfo.classList.remove(
    "show"
  );


  titleField.style.display =
    "none";


  previewSection.classList.remove(
    "show"
  );


  extractionBox.classList.remove(
    "show"
  );


  pdfPreview.removeAttribute(
    "src"
  );


  fullTextPreview.textContent =
    "";


  extractionStat.textContent =
    "-";


  uploadBtn.disabled = true;


  clearMessage();


  progressWrapper.classList.remove(
    "show"
  );


  setProgress(
    0,
    "Ready"
  );

}


/* =========================================================
   PROGRESS
   ========================================================= */

function setProgress(
  percent,
  text
) {

  progressWrapper.classList.add(
    "show"
  );


  const p =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );


  progressFill.style.width =
    p + "%";


  progressPercent.textContent =
    p + "%";


  progressText.textContent =
    text || "";

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(
  type,
  text
) {

  message.className =
    "message show " + type;


  message.textContent =
    text;

}


function clearMessage() {

  message.className =
    "message";


  message.textContent =
    "";

}

</script>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PaperLab</title>

    <meta
        name="description"
        content="PaperLab — Research and Literature Workspace"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f7f7f5;
            color: #171717;
        }

        .loading-screen {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            gap: 18px;
        }

        .logo {

            width: 58px;
            height: 58px;

            object-fit: contain;

            border-radius: 12px;
        }

        .brand {

            font-size: 17px;
            font-weight: 700;

            letter-spacing: -.4px;
        }

        .loading {

            display: flex;
            align-items: center;

            gap: 6px;
        }

        .loading span {

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #777;

            animation: loading 1.2s infinite ease-in-out;
        }

        .loading span:nth-child(2) {
            animation-delay: .15s;
        }

        .loading span:nth-child(3) {
            animation-delay: .30s;
        }

        @keyframes loading {

            0%,
            60%,
            100% {
                opacity: .25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

    </style>

</head>


<body>


    <div class="loading-screen">

        <img
            src="{{ url_for('static', filename='logo.png') }}"
            alt="PaperLab"
            class="logo"
        >

        <div class="brand">
            PaperLab
        </div>

        <div class="loading">

            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>


<script>

    /*
     * =====================================================
     * PAPERLAB
     * Application Entry Point
     * =====================================================
     *
     * index.html hanya berfungsi sebagai navigator.
     *
     * Alur:
     *
     * index.html
     *      ↓
     * login.html
     *      ↓
     * menu_utama.html
     *
     * =====================================================
     */


    document.addEventListener(
        "DOMContentLoaded",
        function () {

            /*
             * Beri sedikit waktu agar loading screen
             * tidak terasa seperti halaman kosong.
             */

            setTimeout(
                function () {

                    window.location.href =
                        "{{ url_for('login') }}";

                },
                500
            );

        }
    );


</script>


</body>
</html>

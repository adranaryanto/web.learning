<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PaperMind AI | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #f5f7fb;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #111827;
        }


        /* =================================
           BACKGROUND
        ================================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            z-index: 0;
        }


        .shape {
            position: absolute;

            border-radius: 50%;
        }


        .shape-1 {
            width: 420px;
            height: 420px;

            background: #e8f0ff;

            top: -220px;
            left: -160px;
        }


        .shape-2 {
            width: 360px;
            height: 360px;

            background: #edf2ff;

            bottom: -180px;
            right: -130px;
        }


        /* =================================
           LOGIN CONTAINER
        ================================= */

        .login-container {
            width: 100%;
            max-width: 420px;

            padding: 24px;

            position: relative;
            z-index: 2;
        }


        /* =================================
           BRAND
        ================================= */

        .brand {
            text-align: center;

            margin-bottom: 28px;
        }


        .brand-logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #2563eb;

            color: white;

            border-radius: 17px;

            font-size: 29px;

            font-weight: 700;

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.20);
        }


        .brand h1 {
            font-size: 28px;

            font-weight: 700;

            letter-spacing: -0.5px;
        }


        .brand p {
            margin-top: 7px;

            font-size: 13px;

            color: #6b7280;
        }


        /* =================================
           LOGIN CARD
        ================================= */

        .login-card {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 20px 55px rgba(15, 23, 42, 0.08);
        }


        .login-card-header {
            margin-bottom: 25px;
        }


        .login-card-header h2 {
            font-size: 21px;

            font-weight: 700;
        }


        .login-card-header p {
            margin-top: 7px;

            font-size: 13px;

            line-height: 1.5;

            color: #6b7280;
        }


        /* =================================
           FORM
        ================================= */

        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: #374151;
        }


        .input {
            width: 100%;

            height: 46px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            padding: 0 14px;

            outline: none;

            font-size: 13px;

            color: #111827;

            background: #ffffff;

            transition: 0.2s;
        }


        .input::placeholder {
            color: #9ca3af;
        }


        .input:hover {
            border-color: #9ca3af;
        }


        .input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }


        /* =================================
           PASSWORD
        ================================= */

        .password-wrapper {
            position: relative;
        }


        .password-wrapper .input {
            padding-right: 60px;
        }


        .show-password {
            position: absolute;

            right: 13px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #2563eb;

            font-size: 11px;

            font-weight: 600;

            cursor: pointer;
        }


        .show-password:hover {
            text-decoration: underline;
        }


        /* =================================
           OPTIONS
        ================================= */

        .form-options {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: 3px;

            margin-bottom: 22px;

            font-size: 12px;
        }


        .remember {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #6b7280;

            cursor: pointer;
        }


        .remember input {
            width: 14px;
            height: 14px;

            accent-color: #2563eb;
        }


        .forgot {
            color: #2563eb;

            text-decoration: none;

            font-weight: 600;

            cursor: pointer;
        }


        .forgot:hover {
            text-decoration: underline;
        }


        /* =================================
           LOGIN BUTTON
        ================================= */

        .login-button {
            width: 100%;

            height: 46px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .login-button:hover {
            background: #1d4ed8;

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.18);
        }


        .login-button:active {
            transform: translateY(1px);
        }


        .login-button:disabled {
            opacity: 0.7;

            cursor: wait;
        }


        /* =================================
           MESSAGE
        ================================= */

        .login-message {
            display: none;

            margin-top: 14px;

            padding: 10px 12px;

            border-radius: 8px;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;
        }


        .login-message.error {
            display: block;

            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #b91c1c;
        }


        .login-message.success {
            display: block;

            background: #f0fdf4;

            border: 1px solid #bbf7d0;

            color: #15803d;
        }


        /* =================================
           FOOTER
        ================================= */

        .footer {
            text-align: center;

            margin-top: 20px;

            font-size: 11px;

            color: #9ca3af;
        }


        /* =================================
           RESPONSIVE
        ================================= */

        @media (max-width: 480px) {

            .login-container {
                padding: 18px;
            }


            .login-card {
                padding: 25px 20px;
            }


            .brand h1 {
                font-size: 25px;
            }


            .brand-logo {
                width: 58px;
                height: 58px;

                font-size: 26px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         BACKGROUND
    ================================= -->

    <div class="background">

        <div class="shape shape-1"></div>

        <div class="shape shape-2"></div>

    </div>



    <!-- =================================
         LOGIN CONTAINER
    ================================= -->

    <main class="login-container">


        <!-- BRAND -->

        <div class="brand">

            <div class="brand-logo">
                P
            </div>


            <h1>
                PaperMind AI
            </h1>


            <p>
                Intelligent Literature Research Assistant
            </p>

        </div>



        <!-- LOGIN CARD -->

        <div class="login-card">


            <!-- HEADER -->

            <div class="login-card-header">

                <h2>
                    Welcome Back
                </h2>


                <p>
                    Sign in to access your literature
                    research workspace.
                </p>

            </div>



            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>


                <input
                    type="text"
                    id="username"
                    class="input"
                    placeholder="Enter your username"
                    autocomplete="username"
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        class="input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >


                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>

            </div>



            <!-- OPTIONS -->

            <div class="form-options">


                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >


                    <span>
                        Remember me
                    </span>

                </label>



                <a
                    href="#"
                    class="forgot"
                    id="forgotPassword"
                >
                    Forgot password?
                </a>


            </div>



            <!-- LOGIN BUTTON -->

            <button
                type="button"
                class="login-button"
                id="loginButton"
            >
                Sign In
            </button>



            <!-- MESSAGE -->

            <div
                id="loginMessage"
                class="login-message"
            ></div>


        </div>



        <!-- FOOTER -->

        <div class="footer">

            PaperMind AI · Literature Intelligence Platform

        </div>


    </main>



    <script>


        /* =================================
           CONFIGURATION
        ================================= */

        const CONFIG = {

            /*
             * Halaman menu utama.
             *
             * Struktur folder:
             *
             * index.html
             *
             * templates/
             *     menu_utama.html
             */

            DASHBOARD_URL:
                "templates/menu_utama.html"

        };



        /* =================================
           ELEMENTS
        ================================= */

        const usernameInput =
            document.getElementById("username");


        const passwordInput =
            document.getElementById("password");


        const rememberInput =
            document.getElementById("remember");


        const loginButton =
            document.getElementById("loginButton");


        const loginMessage =
            document.getElementById("loginMessage");


        const showPasswordButton =
            document.getElementById("showPassword");


        const forgotPasswordButton =
            document.getElementById("forgotPassword");



        /* =================================
           SHOW PASSWORD
        ================================= */

        showPasswordButton.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    showPasswordButton.textContent =
                        "Hide";

                } else {

                    passwordInput.type = "password";

                    showPasswordButton.textContent =
                        "Show";

                }

            }
        );



        /* =================================
           SHOW MESSAGE
        ================================= */

        function showMessage(text, type) {

            loginMessage.textContent = text;

            loginMessage.className =
                "login-message " + type;

        }



        /* =================================
           CLEAR MESSAGE
        ================================= */

        function clearMessage() {

            loginMessage.textContent = "";

            loginMessage.className =
                "login-message";

        }



        /* =================================
           LOGIN
        ================================= */

        function login() {

            clearMessage();


            const username =
                usernameInput.value.trim();


            const password =
                passwordInput.value;


            const remember =
                rememberInput.checked;



            /* -----------------------------
               USERNAME VALIDATION
            ----------------------------- */

            if (!username) {

                showMessage(
                    "Please enter your username.",
                    "error"
                );

                usernameInput.focus();

                return;
            }



            /* -----------------------------
               PASSWORD VALIDATION
            ----------------------------- */

            if (!password) {

                showMessage(
                    "Please enter your password.",
                    "error"
                );

                passwordInput.focus();

                return;
            }



            /* -----------------------------
               REMEMBER USERNAME
            ----------------------------- */

            if (remember) {

                localStorage.setItem(
                    "papermind_username",
                    username
                );

            } else {

                localStorage.removeItem(
                    "papermind_username"
                );

            }



            /* -----------------------------
               LOGIN
            ----------------------------- */

            loginButton.disabled = true;

            loginButton.textContent =
                "Signing In...";


            showMessage(
                "Login successful. Opening workspace...",
                "success"
            );


            /*
             * Authentication backend belum
             * diterapkan.
             *
             * Untuk sementara username dan
             * password yang diisi akan langsung
             * diarahkan ke menu utama.
             */

            setTimeout(
                function () {

                    window.location.href =
                        CONFIG.DASHBOARD_URL;

                },
                400
            );

        }



        /* =================================
           LOGIN BUTTON
        ================================= */

        loginButton.addEventListener(
            "click",
            login
        );



        /* =================================
           ENTER KEY
        ================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    login();

                }

            }
        );



        /* =================================
           FORGOT PASSWORD
        ================================= */

        forgotPasswordButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                showMessage(
                    "Password recovery will be available in a future version.",
                    "error"
                );

            }
        );



        /* =================================
           LOAD REMEMBERED USERNAME
        ================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const savedUsername =
                    localStorage.getItem(
                        "papermind_username"
                    );


                if (savedUsername) {

                    usernameInput.value =
                        savedUsername;


                    rememberInput.checked =
                        true;


                    passwordInput.focus();

                } else {

                    usernameInput.focus();

                }

            }
        );

    </script>


</body>
</html>

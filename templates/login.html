<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PaperLab — Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background-image:
                linear-gradient(
                    rgba(0,0,0,.25),
                    rgba(0,0,0,.25)
                ),
                url("/static/background.png");

            background-size: cover;
            background-position: center;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: min(420px, calc(100% - 40px));

            padding: 40px;

            background: rgba(255,255,255,.94);

            border-radius: 18px;

            box-shadow:
                0 25px 80px rgba(0,0,0,.2);
        }

        .logo {
            width: 64px;
            height: 64px;

            object-fit: contain;

            display: block;

            margin: 0 auto 22px;
        }

        h1 {
            text-align: center;

            font-size: 25px;

            letter-spacing: -0.8px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 13px;

            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 11px;

            font-weight: 600;

            color: #444;
        }

        input {
            width: 100%;

            height: 44px;

            padding: 0 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            outline: none;

            font-size: 13px;

            transition: .2s;
        }

        input:focus {
            border-color: #222;

            box-shadow:
                0 0 0 3px rgba(0,0,0,.05);
        }

        .login-button {
            width: 100%;

            height: 45px;

            border: none;

            border-radius: 8px;

            background: #171717;

            color: white;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 8px;

            transition: .2s;
        }

        .login-button:hover {
            background: #303030;
        }

        .error {
            display: none;

            margin-top: 14px;

            padding: 10px;

            border-radius: 7px;

            background: #fff0f0;

            color: #b33;

            font-size: 11px;

            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <img
            src="/static/logo.png"
            alt="PaperLab Logo"
            class="logo"
        >

        <h1>PaperLab</h1>

        <p class="subtitle">
            Research & Literature Workspace
        </p>


        <form id="loginForm">

            <div class="field">

                <label for="username">
                    USERNAME
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Sign In
            </button>

        </form>


        <div
            id="loginError"
            class="error"
        >
            Invalid username or password.
        </div>

    </div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        /*
         * TEMPORARY LOGIN
         *
         * Authentication backend will be
         * connected later.
         */

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value.trim();


        if (username && password) {

            window.location.href =
                "/menu-utama";

        } else {

            document
                .getElementById("loginError")
                .style.display = "block";

        }

    });

</script>

</body>
</html>
